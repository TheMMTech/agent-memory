# The helper uses only the Python standard library, so the one dependency
# ecosystem is the SHA-pinned GitHub Actions in .github/workflows/.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies
